name: Publish to Open VSX

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    name: Build and Publish Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          if [ -f package.json ]; then
            npm install || true
          fi

      - name: Package Extension (.vsix)
        run: npx --yes @vscode/vsce package --no-git-tag-version --out package.vsix

      - name: Publish to Open VSX Registry
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "Error: OVSX_PAT secret is not defined in GitHub repository secrets!"
            exit 1
          fi
          npx --yes ovsx publish package.vsix -p "$OVSX_PAT"
